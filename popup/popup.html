<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   

    <title>Herramientas SAT</title>

    <link rel="stylesheet" href="/popup/normalize.css" />
    <link rel="stylesheet" href="/lib/hint.css-2.7.0/hint.min.css" />
    <link rel="stylesheet" href="/popup/popup.css" />

    <script defer src="/popup/popup.js"></script>
    <script defer src="/popup/backup.js"></script>
    <script defer src="./csf.js"></script>
    <script type="module" src="./pdf.js/build/pdf.mjs"></script>
    <script type="module" src="./pdf.js/build/pdf.worker.mjs"></script>
    
</head>

<body>
    

    <div class="main">
        <div class="title-container">
            <div class="logo-container">
                <img src="../src/Logo.svg" alt="Logo">
            </div>
            <div class="popup-title">
                <h2 class=>HERRAMIENTAS SAT</h2>
            </div>
        </div>

        <div class="popup-option enabledContainer" style="display: flex; justify-content: space-between; align-items: center;">
            <label class="toggle-switch" >
                <input type="checkbox" id="enabledToggle">
                <span class="slider"></span>
                <span class="toggle-label"></span>
            </label>
            <div class="regime-toggle">
                <select id="regimeSelect" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9rem;">
                    <option value="fisica">Persona Física</option>
                    <option value="moral">Persona Moral</option>
                </select>
            </div>
        </div>

        <div id="general-section"></div>
        <div id="dynamic-section"></div>
        <div id="certificados-section"></div>

        <details>
            <summary class="popup-option_title" style="cursor: pointer; user-select: none;">Respaldos</summary>
            <div class="popup-option flex-spacing" id="backup">
                <button id="backup-btn" class="normal-button hint--top-right hint--rounded hint--info"
                    aria-label="Crear archivo de respaldo">
                    Respaldar
                </button>
                <button id="restore-btn" class="normal-button hint--top-left hint--rounded hint--info"
                    aria-label="Restaurar desde archivo">
                    Restaurar
                </button>
                <input type="file" accept="application/json" id="restore-input" class="hidden">
            </div>
        </details>
    </div>
</body>

</html>
